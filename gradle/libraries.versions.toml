[versions]
# Plugins
kotlin = "1.9.25"
shadow = "8.3.0"

# Dependencites
kotlin-logging = "7.0.0"
ktorm = "4.0.0"
sqlite = "3.46.0.0"
thrivi = "13199ef603"

#
dico = "f00e6003b3"
notchity = "8bf2b5125e"

[libraries]
kotlin-logging = { group = "io.github.oshai", name = "kotlin-logging-jvm", version.ref = "kotlin-logging" }
ktorm = { group = "org.ktorm", name = "ktorm-support-sqlite", version.ref = "ktorm" }
sqlite = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqlite" }
thrivi = { group = "com.github.kvdpxne", name = "thrivi", version.ref = "thrivi" }

dico-api = { group = "com.github.kvdpxne.dico", name = "api", version.ref = "dico" }
dico-core = { group = "com.github.kvdpxne.dico", name = "core", version.ref = "dico" }
notchity = { group = "com.github.kvdpxne", name = "notchity", version.ref = "notchity" }

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }

[bundles]
disco = ["dico-api", "dico-core"]